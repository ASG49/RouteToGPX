<!DOCTYPE html>
<!--
    RouteToGPX v2.2
    © 2026 Tony Gozdz
    Last Updated: October 11, 2026 6:35 PM EDT

    Converts a Google Maps directions link (long URL, or maps.app.goo.gl short link)
    into a simplified GPX track with elevation. Runs entirely in the browser.

    Pipeline:
    1. Extract stops (coordinates) and travel mode from the Google Maps URL
    2. Short links (maps.app.goo.gl) cannot be read by a web page: open them in a browser and paste the full address
    3. Route geometry is calculated with OSRM / OSM routing (free, no API key)
    4. Track is simplified with the SAME Douglas-Peucker algorithm and percent-to-tolerance
       formula as GPXWeaver (default 1%, the lowest GPXWeaver setting)
    5. Elevation for the simplified points from OpenTopoData (USGS NED 10 m, SRTM 30 m fallback)
    6. GPX saved with 6-decimal coordinates, GPXWeaver-style structure

    Version 2.2 Changes (Auto-Fit Margin - October 11, 2026):
    - Auto-fit after Convert now leaves a margin of 5% of the map's shorter side on all
      edges, so the whole route is always in view and not touching the edges

    Version 2.1 Changes (Muted Low-Zoom Topo Colour - October 11, 2026):
    - OpenTopoMap tiles are desaturated and shifted slightly toward green when zoomed out
      (zoom 11 and below), toning down the rusty mountain colour; normal colours when zoomed in

    Version 2.0 Changes (Profile Cursor - October 11, 2026):
    - NEW: moving the mouse over the map near the track draws a vertical line on the
      elevation profile at the matching distance, with a dot on the profile curve and a
      label (distance in km and elevation in m). A matching dot appears on the track
    - Matching uses the closest point on the track line (not just the nearest vertex),
      within 40 px of the cursor. Farther away, the cursor line hides
    - Tap/click works too, for touch screens. Leaving the map hides the cursor
    - Profile now has a second transparent canvas for the cursor, so the profile itself is
      not redrawn on every mouse move

    Version 1.9 Changes (Cleanup - October 11, 2026):
    - REMOVED all short-link Worker code and settings (setup help, copy button, Worker URL
      box, embedded Worker source). Short links now show a clear message: open the link in
      your browser and paste the full address from the address bar
    - Link box placeholder updated to say so
    - No other changes

    Version 1.8 Changes (Corrected Worker Setup Steps - October 11, 2026):
    - FIXED: the in-app short-link setup steps described a Cloudflare dashboard "Edit code"
      flow that current Cloudflare docs do not describe. Steps now use the Cloudflare Workers
      Playground (paste code, Deploy, copy the workers.dev address), which needs no install
    - No other changes

    Version 1.7 Changes (Locate on Open - October 11, 2026):
    - The map now centres on your current location when the app opens (browser asks for
      permission once). Skipped if a route is already on the map
    - Fallback view (permission denied, no location, or timeout) is now the continental US
      instead of central Idaho
    - Location is used only to centre the map. It is not stored or sent anywhere

    Version 1.6 Changes (Short-Link Worker Built In - October 11, 2026):
    - The short-link expander Worker code is now embedded in this file. Settings has a
      "How to set up short links" section with 3 steps and a "Copy Worker code" button
    - The copied code allows this page's own origin (plus asg49.github.io and local files),
      so it works wherever the app is hosted
    - Settings panel scrolls on small screens
    - Still needs a one-time free Cloudflare Worker: browsers cannot read where a Google
      short link redirects, so a small server-side step is unavoidable

    Version 1.5 Changes (Icon in Header - October 11, 2026):
    - The app icon now also appears in the top bar, replacing the compass emoji
      (same inline SVG as the tab icon, no extra file)

    Version 1.4 Changes (Tab Icon - October 11, 2026):
    - NEW: browser tab icon (inline SVG, no extra file): simplified green world map with a
      red trapezoid route/road marker. Stays readable at 16 px

    Version 1.3 Changes (Terrain-Tile Elevation - October 11, 2026):
    - ROOT CAUSE (from browser console log): OpenTopoData was blocked by CORS when the app is
      opened from a local file (origin 'null'), and the parallel Open-Meteo fallback was
      rejected with HTTP 429 (free tier is about 600 coordinates per minute, counted per
      coordinate). 1,537 of 2,237 points ended up interpolated
    - NEW primary elevation source: free AWS/Mapzen "terrarium" terrain tiles, loaded as
      images and decoded in the browser (no API key, no per-request rate limit, no daily cap).
      Zoom is chosen automatically (up to 14, fewer than 120 tiles). Every point gets its own
      bilinear-interpolated elevation. Failed tiles are retried; leftovers are interpolated
    - Open-Meteo is now only the fallback: one lookup per ~500 m, one request every 10.5 s
      (stays under its limit), waits and retries on 429, interpolates in between
    - OpenTopoData removed (blocked from local files, 1 request/s, 1,000/day limit)

    Version 1.2 Changes (Speed + Compact Layout - October 11, 2026):
    - FIXED: slow elevation. When OpenTopoData is unreachable it is now abandoned after the
      first failed batch (first request fails fast, no 7.5 s of retries per batch), and the
      rest goes to Open-Meteo, 4 requests in parallel (no 1-per-second delay needed there)
    - OpenTopoData is still used first when reachable (10 m USGS data is more detailed than
      Open-Meteo's 90 m data, which also makes the profile noisier)
    - Ascent/descent noise threshold raised from 3 m to 10 m (7,800 m on a 313 km loop was
      mostly 90 m-grid noise)
    - Compact layout: title, link box, Convert, Save, track name and Settings share ONE
      top row; status/summary is a single line; Settings opens as an overlay; the elevation
      profile floats over the map. The map now gets nearly the whole screen
    - Enter key in the link box starts the conversion

    Version 1.1 Changes (Elevation Reliability - October 11, 2026):
    - FIXED: "Failed to fetch" from the elevation service left the whole track without elevation
    - Each OpenTopoData request now retries up to 3 times with backoff (network errors,
      HTTP 429 and 5xx are all treated as retryable)
    - If OpenTopoData still fails for a batch, that batch falls back to Open-Meteo elevation
    - Any points still without elevation are filled by linear interpolation along the
      track, and the status line says how many were interpolated
    - Clearer error text (which service, which request) and elevation source shown in results

    Version 1.0 Changes (Initial Release - October 11, 2026):
    - Parses Google Maps /maps/dir/ URLs (stop coordinates read from the data= block),
      api=1 style URLs, and saddr/daddr URLs
    - Travel mode detected from URL (driving / bicycling / walking; transit routed as walking)
    - Short link expansion through user-deployed Worker (URL saved in browser)
    - Simplification slider 1-95%, default 1%, algorithm identical to GPXWeaver v7.0
    - Elevation lookup after simplification (fewer requests), progress shown, GPX still
      saveable without elevation if the service is unavailable
    - Leaflet preview (OpenTopoMap default), elevation profile, ascent/descent summary
    - Editable track name; address-style stop names shortened to city/place names

    Known limits:
    - Route line is recalculated by OSM routing, so it can differ from Google's line,
      mostly on minor roads and trails. Google route options (avoid highways/tolls,
      departure time) are not carried over.
-->

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // ===== CONSTANTS =====
        const APP_VERSION = '2.2';
        const TERRAIN_TILE_URL = 'https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png';
        const TERRAIN_MAX_ZOOM = 14;            // finest tiles tried (short routes)
        const TERRAIN_MIN_ZOOM = 9;             // coarsest tiles allowed (very long routes)
        const TERRAIN_MAX_TILES = 120;          // keep the download reasonable
        const TERRAIN_PARALLEL = 8;             // tiles loading at once
        const OM_BATCH = 100;                   // Open-Meteo max coordinates per request (fallback only)
        const OM_BATCH_DELAY_MS = 10500;        // Open-Meteo free tier: about 600 coordinates per minute
        const OM_SAMPLE_SPACING_M = 500;        // fallback: one lookup per ~500 m, interpolate between

        const ROUTERS = {
            car:  'https://router.project-osrm.org/route/v1/driving/',
            bike: 'https://routing.openstreetmap.de/routed-bike/route/v1/driving/',
            foot: 'https://routing.openstreetmap.de/routed-foot/route/v1/driving/'
        };

        // ===== STATE =====
        let map, routeLayer, stopLayer;
        let current = null;   // { points: [{lat, lon, ele}], waypoints, name }
        let profileState = null;      // geometry of the drawn profile (for the cursor line)
        let trackPx = null;           // track points projected to pixels at trackPxZoom
        let trackPxZoom = null;
        let cursorMarker = null;      // dot on the map showing the cursor position on the track
        let pointerFramePending = false;
        const CURSOR_HIT_PX = 40;     // cursor must be this close to the track to show the line
        let busy = false;

        // ===== UTILITIES =====
        function sanitizeXML(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2800);
        }

        function setStatus(text, kind) {
            const el = document.getElementById('status');
            el.textContent = text || '';
            el.className = kind || '';
        }

        function haversine(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) ** 2 +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        // ===== GOOGLE MAPS URL PARSING =====
        function extractUrl(text) {
            const m = String(text || '').match(/https?:\/\/[^\s<>"']+/i);
            return m ? m[0].replace(/[),.;]+$/, '') : null;
        }

        function isShortLink(u) {
            return /^https?:\/\/(maps\.app\.goo\.gl|goo\.gl\/maps|g\.co\/maps)/i.test(u);
        }

        function decodePlace(s) {
            try { return decodeURIComponent(s.replace(/\+/g, ' ')).trim(); }
            catch (e) { return s.replace(/\+/g, ' ').trim(); }
        }

        function parseLatLon(str) {
            const m = String(str).match(/^\s*(-?\d{1,3}(?:\.\d+)?)\s*,\s*(-?\d{1,3}(?:\.\d+)?)\s*$/);
            if (!m) return null;
            const lat = parseFloat(m[1]), lon = parseFloat(m[2]);
            if (Math.abs(lat) > 90 || Math.abs(lon) > 180) return null;
            return { lat, lon };
        }

        function modeFromUrl(urlStr, u) {
            // data block: !3e0 driving, !3e1 bicycling, !3e2 walking, !3e3 transit
            const m = urlStr.match(/!3e(\d)/);
            if (m) return ['driving', 'bicycling', 'walking', 'transit'][parseInt(m[1], 10)] || 'driving';
            const tm = (u.searchParams.get('travelmode') || u.searchParams.get('dirflg') || '').toLowerCase();
            if (tm === 'bicycling' || tm === 'b') return 'bicycling';
            if (tm === 'walking' || tm === 'w') return 'walking';
            if (tm === 'transit' || tm === 'r') return 'transit';
            return 'driving';
        }

        function parseDirectionsUrl(urlStr) {
            let u;
            try { u = new URL(urlStr); } catch (e) { throw new Error('That is not a valid URL.'); }

            const mode = modeFromUrl(urlStr, u);
            let places = [];
            let coords = [];

            if (u.pathname.indexOf('/maps/dir/') !== -1) {
                const after = u.pathname.split('/maps/dir/')[1] || '';
                for (const seg of after.split('/')) {
                    if (!seg) continue;
                    if (seg.startsWith('@') || seg.startsWith('data=')) break;
                    places.push(decodePlace(seg));
                }
                // Each resolved stop carries its exact position as !2m2!1d<lon>!2d<lat>
                const re = /!2m2!1d(-?\d+(?:\.\d+)?)!2d(-?\d+(?:\.\d+)?)/g;
                let m;
                while ((m = re.exec(urlStr)) !== null) {
                    coords.push({ lat: parseFloat(m[2]), lon: parseFloat(m[1]) });
                }
            } else if (u.searchParams.has('destination')) {
                const origin = u.searchParams.get('origin');
                const dest = u.searchParams.get('destination');
                const via = (u.searchParams.get('waypoints') || '').split('|').filter(Boolean);
                places = [origin, ...via, dest].filter(Boolean);
            } else if (u.searchParams.has('daddr')) {
                const saddr = u.searchParams.get('saddr');
                const daddr = u.searchParams.get('daddr');
                places = [saddr, ...String(daddr || '').split(/\s+to:/)].filter(Boolean);
            } else {
                throw new Error('This is not a Google Maps directions link (it needs a start and a destination).');
            }

            if (places.length < 2) throw new Error('Need at least a start and a destination in the link.');

            const useCoords = coords.length === places.length;
            const waypoints = places.map((p, i) => {
                if (useCoords) return { lat: coords[i].lat, lon: coords[i].lon, label: p };
                const c = parseLatLon(p);
                return c ? { lat: c.lat, lon: c.lon, label: p } : { lat: null, lon: null, label: p };
            });

            return { waypoints, mode };
        }

        async function geocodeMissing(waypoints) {
            let first = true;
            for (const w of waypoints) {
                if (w.lat !== null) continue;
                if (!first) await sleep(1100);
                first = false;
                setStatus(`Locating "${w.label}"…`);
                const r = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(w.label));
                if (!r.ok) throw new Error(`Place lookup failed (HTTP ${r.status}).`);
                const j = await r.json();
                if (!j.length) throw new Error(`Could not locate "${w.label}".`);
                w.lat = parseFloat(j[0].lat);
                w.lon = parseFloat(j[0].lon);
            }
        }

        // ===== ROUTING =====
        function chooseProfile(mode, override) {
            if (override && override !== 'auto') return override;
            if (mode === 'bicycling') return 'bike';
            if (mode === 'walking' || mode === 'transit') return 'foot';
            return 'car';
        }

        async function fetchRoute(waypoints, profile) {
            const coordStr = waypoints.map(w => `${w.lon.toFixed(6)},${w.lat.toFixed(6)}`).join(';');
            const url = ROUTERS[profile] + coordStr + '?overview=full&geometries=geojson&steps=false';
            const r = await fetch(url);
            if (!r.ok) throw new Error(`Routing service failed (HTTP ${r.status}).`);
            const j = await r.json();
            if (j.code !== 'Ok' || !j.routes || !j.routes.length) {
                throw new Error('No route found: ' + (j.message || j.code || 'unknown error'));
            }
            return j.routes[0].geometry.coordinates.map(c => ({ lat: c[1], lon: c[0], ele: null }));
        }

        // ===== SIMPLIFICATION (identical algorithm to GPXWeaver v7.0) =====
        function percentToTolerance(percent) {
            // At 1%:  tolerance = 0.00002
            // At 10%: tolerance = 0.00011
            // At 50%: tolerance = 0.00050
            // At 95%: tolerance = 0.00095
            return 0.00001 + (percent / 100) * 0.00099;
        }

        function getPerpendicularDistance(point, lineStart, lineEnd) {
            const x = point.lat;
            const y = point.lon;
            const x1 = lineStart.lat;
            const y1 = lineStart.lon;
            const x2 = lineEnd.lat;
            const y2 = lineEnd.lon;

            const A = x - x1;
            const B = y - y1;
            const C = x2 - x1;
            const D = y2 - y1;

            const dot = A * C + B * D;
            const lenSq = C * C + D * D;
            let param = -1;

            if (lenSq !== 0) param = dot / lenSq;

            let xx, yy;

            if (param < 0) {
                xx = x1;
                yy = y1;
            } else if (param > 1) {
                xx = x2;
                yy = y2;
            } else {
                xx = x1 + param * C;
                yy = y1 + param * D;
            }

            const dx = x - xx;
            const dy = y - yy;
            return Math.sqrt(dx * dx + dy * dy);
        }

        // Iterative Douglas-Peucker: keeps exactly the same points as GPXWeaver's
        // recursive version (same split rule), but without deep recursion or array slicing.
        function simplifyTrack(points, tolerance) {
            const n = points.length;
            if (n <= 2) return points.slice();
            const keep = new Uint8Array(n);
            keep[0] = 1;
            keep[n - 1] = 1;
            const stack = [[0, n - 1]];
            while (stack.length) {
                const [s, e] = stack.pop();
                let maxDistance = 0;
                let index = -1;
                for (let i = s + 1; i < e; i++) {
                    const d = getPerpendicularDistance(points[i], points[s], points[e]);
                    if (d > maxDistance) {
                        maxDistance = d;
                        index = i;
                    }
                }
                if (index !== -1 && maxDistance > tolerance) {
                    keep[index] = 1;
                    stack.push([s, index], [index, e]);
                }
            }
            return points.filter((_, i) => keep[i] === 1);
        }

        // ===== ELEVATION (terrain tiles first, Open-Meteo fallback) =====
        // Terrarium tiles encode elevation in the colour of each pixel:
        //   metres = (R * 256 + G + B / 256) - 32768
        function tileXY(lat, lon, z) {
            const n = Math.pow(2, z);
            const latRad = lat * Math.PI / 180;
            return {
                x: (lon + 180) / 360 * n,
                y: (1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2 * n
            };
        }

        // Finest zoom whose tile count stays within TERRAIN_MAX_TILES
        function chooseTerrainZoom(pts) {
            let keys = [];
            for (let z = TERRAIN_MAX_ZOOM; z >= TERRAIN_MIN_ZOOM; z--) {
                const set = new Set();
                for (let i = 0; i < pts.length; i++) {
                    const t = tileXY(pts[i].lat, pts[i].lon, z);
                    set.add(Math.floor(t.x) + '/' + Math.floor(t.y));
                    if (set.size > TERRAIN_MAX_TILES && z > TERRAIN_MIN_ZOOM) break;
                }
                keys = Array.from(set);
                if (keys.length <= TERRAIN_MAX_TILES) return { z, keys };
            }
            return { z: TERRAIN_MIN_ZOOM, keys };
        }

        let terrainCanvas = null;
        function loadTerrainTile(z, x, y) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = () => {
                    try {
                        if (!terrainCanvas) {
                            terrainCanvas = document.createElement('canvas');
                            terrainCanvas.width = 256;
                            terrainCanvas.height = 256;
                        }
                        const ctx = terrainCanvas.getContext('2d', { willReadFrequently: true });
                        ctx.clearRect(0, 0, 256, 256);
                        ctx.drawImage(img, 0, 0, 256, 256);
                        const d = ctx.getImageData(0, 0, 256, 256).data;
                        const out = new Float32Array(65536);
                        for (let i = 0, j = 0; i < 65536; i++, j += 4) {
                            out[i] = (d[j] * 256 + d[j + 1] + d[j + 2] / 256) - 32768;
                        }
                        resolve(out);
                    } catch (e) { reject(e); }
                };
                img.onerror = () => reject(new Error('Terrain tile failed to load'));
                img.src = TERRAIN_TILE_URL.replace('{z}', z).replace('{x}', x).replace('{y}', y);
            });
        }

        // Bilinear sample inside one tile; px/py are continuous pixel coordinates (0..256)
        function sampleTile(tile, px, py) {
            const fx = Math.min(Math.max(px - 0.5, 0), 255);
            const fy = Math.min(Math.max(py - 0.5, 0), 255);
            const x0 = Math.floor(fx), y0 = Math.floor(fy);
            const x1 = Math.min(x0 + 1, 255), y1 = Math.min(y0 + 1, 255);
            const tx = fx - x0, ty = fy - y0;
            const v00 = tile[y0 * 256 + x0], v10 = tile[y0 * 256 + x1];
            const v01 = tile[y1 * 256 + x0], v11 = tile[y1 * 256 + x1];
            return (v00 * (1 - tx) + v10 * tx) * (1 - ty) + (v01 * (1 - tx) + v11 * tx) * ty;
        }

        async function fetchTerrainElevations(pts, progress) {
            const { z, keys } = chooseTerrainZoom(pts);
            const tiles = new Map();
            let cursor = 0, done = 0, ok = 0, failed = 0, abort = false;

            async function worker() {
                while (cursor < keys.length && !abort) {
                    const key = keys[cursor++];
                    const [x, y] = key.split('/').map(Number);
                    try {
                        tiles.set(key, await loadTerrainTile(z, x, y));
                        ok++;
                    } catch (err) {
                        tiles.set(key, null);
                        failed++;
                        // first tiles all failing means the service is blocked: give up quickly
                        if (ok === 0 && failed >= 3) abort = true;
                    }
                    done++;
                    progress(`Elevation: terrain tile ${done} of ${keys.length} (zoom ${z})…`);
                }
            }
            await Promise.all(Array.from({ length: Math.min(TERRAIN_PARALLEL, keys.length) }, worker));

            if (ok === 0) throw new Error('Terrain tiles could not be loaded (network or CORS).');

            // One retry for tiles that failed while the others worked
            for (const key of keys) {
                if (tiles.get(key) !== null && tiles.has(key)) continue;
                const [x, y] = key.split('/').map(Number);
                try { tiles.set(key, await loadTerrainTile(z, x, y)); } catch (err) { tiles.set(key, null); }
            }

            let missing = 0;
            pts.forEach(p => {
                const t = tileXY(p.lat, p.lon, z);
                const tx = Math.floor(t.x), ty = Math.floor(t.y);
                const tile = tiles.get(tx + '/' + ty);
                if (!tile) { p.ele = null; missing++; return; }
                p.ele = Math.round(sampleTile(tile, (t.x - tx) * 256, (t.y - ty) * 256) * 10) / 10;
            });
            if (missing === pts.length) throw new Error('No terrain data covered the route.');
            const filled = missing > 0 ? interpolateMissing(pts) : 0;
            return { filled, sources: [`terrain tiles z${z}`], note: '' };
        }

        // ---- Fallback: Open-Meteo, rate-limit friendly ----
        async function fetchJsonWithRetry(url, serviceName, attempts, delayMs) {
            let lastErr = null;
            for (let attempt = 1; attempt <= attempts; attempt++) {
                try {
                    const r = await fetch(url);
                    if (r.status === 429 || r.status >= 500) {
                        lastErr = new Error(`${serviceName} busy (HTTP ${r.status}).`);
                    } else if (!r.ok) {
                        throw Object.assign(new Error(`${serviceName} refused the request (HTTP ${r.status}).`), { fatal: true });
                    } else {
                        return await r.json();
                    }
                } catch (err) {
                    if (err.fatal) throw err;
                    lastErr = (err instanceof TypeError)
                        ? new Error(`Could not reach ${serviceName} (network, blocker or rate-limit reply).`)
                        : err;
                }
                if (attempt < attempts) await sleep(delayMs * attempt);
            }
            throw lastErr;
        }

        async function openMeteoBatch(pts) {
            const lats = pts.map(p => p.lat.toFixed(5)).join(',');
            const lons = pts.map(p => p.lon.toFixed(5)).join(',');
            const url = `https://api.open-meteo.com/v1/elevation?latitude=${lats}&longitude=${lons}`;
            const j = await fetchJsonWithRetry(url, 'Open-Meteo', 3, 15000);
            if (!Array.isArray(j.elevation) || j.elevation.length !== pts.length) throw new Error('Open-Meteo returned unexpected data.');
            return j.elevation.map(v => (typeof v === 'number' && isFinite(v)) ? v : null);
        }

        // Fill points that still have no elevation by interpolating along track distance
        function interpolateMissing(points) {
            const n = points.length;
            const cum = [0];
            for (let i = 1; i < n; i++) {
                cum.push(cum[i - 1] + haversine(points[i - 1].lat, points[i - 1].lon, points[i].lat, points[i].lon));
            }
            const known = [];
            for (let i = 0; i < n; i++) if (points[i].ele !== null) known.push(i);
            if (known.length === 0) return 0;
            let filled = 0;
            let k = 0;   // index into known[]: first known point after i
            for (let i = 0; i < n; i++) {
                if (points[i].ele !== null) continue;
                while (k < known.length && known[k] < i) k++;
                const hi = k < known.length ? known[k] : -1;
                const lo = k > 0 ? known[k - 1] : -1;
                let v;
                if (lo === -1) v = points[hi].ele;
                else if (hi === -1) v = points[lo].ele;
                else {
                    const span = cum[hi] - cum[lo];
                    const t = span > 0 ? (cum[i] - cum[lo]) / span : 0;
                    v = points[lo].ele + t * (points[hi].ele - points[lo].ele);
                }
                points[i].ele = Math.round(v * 10) / 10;
                filled++;
            }
            return filled;
        }

        async function fetchOpenMeteoElevations(pts, progress) {
            const n = pts.length;
            // Sample roughly every OM_SAMPLE_SPACING_M along the track
            const sample = [0];
            let lastDist = 0, dist = 0;
            for (let i = 1; i < n; i++) {
                dist += haversine(pts[i - 1].lat, pts[i - 1].lon, pts[i].lat, pts[i].lon);
                if (dist - lastDist >= OM_SAMPLE_SPACING_M) { sample.push(i); lastDist = dist; }
            }
            if (sample[sample.length - 1] !== n - 1) sample.push(n - 1);

            pts.forEach(p => { p.ele = null; });
            const total = Math.ceil(sample.length / OM_BATCH);
            for (let b = 0; b < total; b++) {
                if (b > 0) await sleep(OM_BATCH_DELAY_MS);
                progress(`Elevation (fallback, rate-limited): request ${b + 1} of ${total}…`);
                const idx = sample.slice(b * OM_BATCH, (b + 1) * OM_BATCH);
                const vals = await openMeteoBatch(idx.map(i => pts[i]));
                idx.forEach((i, k) => { if (vals[k] !== null) pts[i].ele = Math.round(vals[k] * 10) / 10; });
            }
            const filled = interpolateMissing(pts);
            return {
                filled: 0,
                sources: ['Open-Meteo 90 m'],
                note: `Fallback elevation: one lookup per ~${OM_SAMPLE_SPACING_M} m, interpolated in between.`
            };
        }

        // Returns { filled, sources, note } and writes .ele into the points
        async function fetchElevations(pts, progress) {
            try {
                return await fetchTerrainElevations(pts, progress);
            } catch (err1) {
                pts.forEach(p => { p.ele = null; });
                progress('Terrain tiles unavailable, switching to Open-Meteo (slower)…');
                try {
                    return await fetchOpenMeteoElevations(pts, progress);
                } catch (err2) {
                    pts.forEach(p => { p.ele = null; });
                    throw new Error(`${err1.message} Fallback also failed: ${err2.message}`);
                }
            }
        }

        // ===== NAMING =====
        function shortLabel(label) {
            if (parseLatLon(label)) return label.trim();
            const parts = String(label).split(',').map(s => s.trim()).filter(Boolean);
            if (!parts.length) return 'Point';
            // Street addresses start with a house number: use the city part instead
            if (/^\d/.test(parts[0]) && parts.length > 1) return parts[1];
            return parts[0];
        }

        function buildRouteName(waypoints) {
            const a = shortLabel(waypoints[0].label);
            const b = shortLabel(waypoints[waypoints.length - 1].label);
            const stops = waypoints.length - 2;
            let name = (a === b) ? `${a} loop` : `${a} to ${b}`;
            if (stops > 0) name += ` via ${stops} stop${stops > 1 ? 's' : ''}`;
            return name;
        }

        function sanitizeFileName(name) {
            let s = String(name || '').replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '_');
            if (s.length > 80) s = s.substring(0, 80);
            return s || 'route';
        }

        // ===== GPX OUTPUT =====
        function generateGPX(name, points, fileName) {
            const isoTime = new Date().toISOString();
            let gpx = '<?xml version="1.0"?>\n';
            gpx += `<gpx version="1.1" creator="RouteToGPX v${APP_VERSION}" xmlns="http://www.topografix.com/GPX/1/1">\n`;
            gpx += `  <metadata>\n    <name>${sanitizeXML(fileName)}</name>\n    <time>${isoTime}</time>\n  </metadata>\n`;
            gpx += '  <trk>\n';
            gpx += `    <name>${sanitizeXML(name)}</name>\n`;
            gpx += '    <trkseg>\n';
            points.forEach(pt => {
                gpx += `      <trkpt lat="${pt.lat.toFixed(6)}" lon="${pt.lon.toFixed(6)}">\n`;
                if (pt.ele !== null && pt.ele !== undefined) gpx += `        <ele>${pt.ele}</ele>\n`;
                gpx += '      </trkpt>\n';
            });
            gpx += '    </trkseg>\n';
            gpx += '  </trk>\n';
            gpx += '</gpx>\n';
            return gpx;
        }

        async function saveFileWithPicker(content, suggestedName) {
            if (window.showSaveFilePicker) {
                try {
                    const handle = await window.showSaveFilePicker({
                        suggestedName: suggestedName,
                        types: [{ description: 'GPX Files', accept: { 'application/gpx+xml': ['.gpx'] } }]
                    });
                    const writable = await handle.createWritable();
                    await writable.write(content);
                    await writable.close();
                    showToast(`✓ Saved ${suggestedName}`);
                } catch (err) {
                    if (err.name !== 'AbortError') downloadFile(content, suggestedName);
                }
            } else {
                downloadFile(content, suggestedName);
            }
        }

        function downloadFile(content, fileName) {
            const blob = new Blob([content], { type: 'application/gpx+xml' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast(`✓ Saved ${fileName}`);
        }

        async function saveGPX() {
            if (!current) return;
            const nameInput = document.getElementById('name-input').value.trim() || current.name;
            const fileName = sanitizeFileName(nameInput) + '.gpx';
            const gpx = generateGPX(nameInput, current.points, fileName);
            await saveFileWithPicker(gpx, fileName);
        }

        // ===== MAP =====
        function initMap() {
            map = L.map('map', { zoomControl: true, zoomSnap: 0.25, zoomDelta: 0.25 }).setView([39.5, -98.5], 4);

            const baseLayers = {
                'OpenTopoMap': L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { maxZoom: 17, className: 'topo-tiles', attribution: '© OpenTopoMap' }),
                'OpenStreetMap': L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }),
                'Google Terrain': L.tileLayer('https://mt1.google.com/vt/lyrs=p&x={x}&y={y}&z={z}', { maxZoom: 20, attribution: '© Google' }),
                'Google Satellite': L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', { maxZoom: 20, attribution: '© Google' })
            };
            baseLayers['OpenTopoMap'].addTo(map);
            const updateLowZoom = () => map.getContainer().classList.toggle('map-lowzoom', map.getZoom() <= 11);
            map.on('zoomend', updateLowZoom);
            updateLowZoom();
            L.control.layers(baseLayers, null, { position: 'topright', collapsed: true }).addTo(map);
            L.control.scale({ position: 'bottomright', metric: true, imperial: false }).addTo(map);
        }

        // Centre the map on the user's position when the app opens (asks permission once)
        function locateOnOpen() {
            if (!navigator.geolocation) return;
            navigator.geolocation.getCurrentPosition(
                function(pos) {
                    if (routeLayer) return;   // a route is already shown: leave the view alone
                    map.setView([pos.coords.latitude, pos.coords.longitude], 10);
                },
                function(err) {
                    if (err && err.code === 1) showToast('Location not allowed. Showing default map.');
                },
                { enableHighAccuracy: false, timeout: 10000, maximumAge: 600000 }
            );
        }

        function drawRoute(points, waypoints) {
            if (routeLayer) map.removeLayer(routeLayer);
            if (stopLayer) map.removeLayer(stopLayer);

            const latLngs = points.map(p => [p.lat, p.lon]);
            routeLayer = L.polyline(latLngs, { color: '#3498db', weight: 3.5, opacity: 0.9 }).addTo(map);

            const markers = waypoints.map((w, i) => {
                const icon = L.divIcon({
                    className: '',
                    html: `<div class="stop-marker">${i + 1}</div>`,
                    iconSize: [20, 20],
                    iconAnchor: [10, 10]
                });
                const m = L.marker([w.lat, w.lon], { icon });
                m.bindTooltip(shortLabel(w.label));
                return m;
            });
            stopLayer = L.layerGroup(markers).addTo(map);

            map.invalidateSize();
            const msz = map.getSize();
            const pad = Math.round(0.05 * Math.min(msz.x, msz.y));
            map.fitBounds(latLngs, { padding: [pad, pad] });
            rebuildTrackPx();
        }

        // ===== INFO + PROFILE =====
        function computeStats(points) {
            let dist = 0;
            for (let i = 0; i < points.length - 1; i++) {
                dist += haversine(points[i].lat, points[i].lon, points[i + 1].lat, points[i + 1].lon);
            }
            let ascent = 0, descent = 0, minE = Infinity, maxE = -Infinity;
            let ref = null;
            const THRESH = 10; // metres: ignore elevation noise smaller than this
            points.forEach(p => {
                if (p.ele === null || p.ele === undefined) return;
                if (p.ele < minE) minE = p.ele;
                if (p.ele > maxE) maxE = p.ele;
                if (ref === null) { ref = p.ele; return; }
                const d = p.ele - ref;
                if (d >= THRESH) { ascent += d; ref = p.ele; }
                else if (d <= -THRESH) { descent -= d; ref = p.ele; }
            });
            const hasEle = isFinite(minE);
            return { dist, ascent, descent, minE: hasEle ? minE : null, maxE: hasEle ? maxE : null };
        }

        function drawProfile(points) {
            const canvas = document.getElementById('profile');
            const wrap = document.getElementById('profile-wrap');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            hideProfileCursor();
            profileState = null;
            const withEle = points.filter(p => p.ele !== null && p.ele !== undefined);
            if (withEle.length < 2) { wrap.classList.remove('show'); return; }
            wrap.classList.add('show');

            const cum = [0];
            for (let i = 1; i < points.length; i++) {
                cum.push(cum[i - 1] + haversine(points[i - 1].lat, points[i - 1].lon, points[i].lat, points[i].lon));
            }
            const total = cum[cum.length - 1] || 1;
            let minE = Infinity, maxE = -Infinity;
            withEle.forEach(p => { minE = Math.min(minE, p.ele); maxE = Math.max(maxE, p.ele); });
            const range = Math.max(maxE - minE, 1);
            const W = canvas.width, H = canvas.height, pad = 12;

            ctx.beginPath();
            let started = false;
            points.forEach((p, i) => {
                if (p.ele === null || p.ele === undefined) return;
                const x = pad + (cum[i] / total) * (W - 2 * pad);
                const y = H - pad - ((p.ele - minE) / range) * (H - 2 * pad);
                if (!started) { ctx.moveTo(x, y); started = true; } else { ctx.lineTo(x, y); }
            });
            ctx.strokeStyle = '#55efc4';
            ctx.lineWidth = 3;
            ctx.stroke();

            ctx.fillStyle = '#ecf0f1';
            ctx.font = '22px sans-serif';
            ctx.fillText(`${Math.round(maxE)} m`, pad + 4, 26);
            ctx.fillText(`${Math.round(minE)} m`, pad + 4, H - pad - 4);
            ctx.textAlign = 'right';
            ctx.fillText(`${(total / 1000).toFixed(0)} km`, W - pad - 4, H - pad - 4);
            ctx.textAlign = 'left';

            profileState = { cum, total, minE, maxE, range, W, H, pad };
        }

        // ---- Cursor: vertical line on the profile that follows the mouse over the map ----
        function hideProfileCursor() {
            const c = document.getElementById('profile-cursor');
            if (c) c.getContext('2d').clearRect(0, 0, c.width, c.height);
            if (cursorMarker && map && map.hasLayer(cursorMarker)) map.removeLayer(cursorMarker);
        }

        function drawProfileCursor(distM, ele) {
            const ps = profileState;
            if (!ps) return;
            const c = document.getElementById('profile-cursor');
            const ctx = c.getContext('2d');
            ctx.clearRect(0, 0, c.width, c.height);

            const x = ps.pad + (distM / ps.total) * (ps.W - 2 * ps.pad);
            const y = ps.H - ps.pad - ((ele - ps.minE) / ps.range) * (ps.H - 2 * ps.pad);

            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, ps.H);
            ctx.stroke();

            ctx.fillStyle = '#ffeaa7';
            ctx.strokeStyle = '#e03131';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(x, y, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            const label = `${(distM / 1000).toFixed(1)} km · ${Math.round(ele)} m`;
            ctx.font = 'bold 22px sans-serif';
            const w = ctx.measureText(label).width + 14;
            let lx = x + 10;
            if (lx + w > ps.W - 4) lx = x - 10 - w;
            ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
            ctx.fillRect(lx, 36, w, 30);
            ctx.fillStyle = '#ffffff';
            ctx.fillText(label, lx + 7, 59);
        }

        function rebuildTrackPx() {
            if (!current || !map) { trackPx = null; trackPxZoom = null; return; }
            const z = map.getZoom();
            trackPx = current.points.map(p => map.project([p.lat, p.lon], z));
            trackPxZoom = z;
        }

        // Closest point on the track polyline to a map position (in screen pixels)
        function nearestOnTrack(latlng) {
            const z = map.getZoom();
            if (!trackPx || trackPxZoom !== z) rebuildTrackPx();
            if (!trackPx || trackPx.length < 2) return null;
            const m = map.project(latlng, z);
            let best = Infinity, bi = 0, bt = 0;
            for (let i = 0; i < trackPx.length - 1; i++) {
                const a = trackPx[i], b = trackPx[i + 1];
                const dx = b.x - a.x, dy = b.y - a.y;
                const l2 = dx * dx + dy * dy;
                let t = l2 > 0 ? ((m.x - a.x) * dx + (m.y - a.y) * dy) / l2 : 0;
                t = Math.max(0, Math.min(1, t));
                const ex = a.x + t * dx - m.x, ey = a.y + t * dy - m.y;
                const d = ex * ex + ey * ey;
                if (d < best) { best = d; bi = i; bt = t; }
            }
            return { dist: Math.sqrt(best), i: bi, t: bt };
        }

        function updateCursorFromLatLng(latlng) {
            if (!current || !profileState) return;
            const hit = nearestOnTrack(latlng);
            if (!hit || hit.dist > CURSOR_HIT_PX) { hideProfileCursor(); return; }

            const pts = current.points, cum = profileState.cum;
            const a = pts[hit.i], b = pts[hit.i + 1];
            const distM = cum[hit.i] + hit.t * (cum[hit.i + 1] - cum[hit.i]);
            const ele = a.ele + hit.t * (b.ele - a.ele);
            drawProfileCursor(distM, ele);

            const pos = [a.lat + hit.t * (b.lat - a.lat), a.lon + hit.t * (b.lon - a.lon)];
            if (!cursorMarker) {
                cursorMarker = L.circleMarker(pos, {
                    radius: 6, color: '#e03131', weight: 3, fillColor: '#ffeaa7', fillOpacity: 1, interactive: false
                });
            } else {
                cursorMarker.setLatLng(pos);
            }
            if (!map.hasLayer(cursorMarker)) cursorMarker.addTo(map);
        }

        function onMapPointer(e) {
            if (!current || !profileState || pointerFramePending) return;
            pointerFramePending = true;
            const latlng = e.latlng;
            requestAnimationFrame(function() {
                pointerFramePending = false;
                updateCursorFromLatLng(latlng);
            });
        }

        function showResult(rawCount) {
            const s = computeStats(current.points);
            let text = `${current.points.length.toLocaleString()} pts (from ${rawCount.toLocaleString()}) · ${(s.dist / 1000).toFixed(2)} km`;
            if (s.minE !== null) {
                text += ` · ↑ ${Math.round(s.ascent)} m ↓ ${Math.round(s.descent)} m · ${Math.round(s.minE)}–${Math.round(s.maxE)} m`;
                if (current.eleSources && current.eleSources.length) text += ` · ${current.eleSources.join(' + ')}`;
            } else {
                text += ' · no elevation';
            }
            const nameInput = document.getElementById('name-input');
            nameInput.value = current.name;
            nameInput.classList.add('show');
            drawProfile(current.points);
            return text;
        }

        function resetResultUI() {
            document.getElementById('name-input').classList.remove('show');
            document.getElementById('profile-wrap').classList.remove('show');
            hideProfileCursor();
            profileState = null;
            trackPx = null;
        }

        // ===== MAIN FLOW =====
        async function convert() {
            if (busy) return;
            const raw = document.getElementById('url-input').value;
            let url = extractUrl(raw);
            if (!url) { setStatus('Paste a Google Maps directions link first.', 'error'); return; }

            busy = true;
            document.getElementById('convert-btn').disabled = true;
            document.getElementById('save-btn').disabled = true;
            resetResultUI();
            current = null;

            try {
                if (isShortLink(url)) {
                    throw new Error('Short links cannot be read here. Open the link in your browser, then copy the full address from the address bar and paste that.');
                }

                setStatus('Reading stops from link…');
                const parsed = parseDirectionsUrl(url);
                await geocodeMissing(parsed.waypoints);

                const profile = chooseProfile(parsed.mode, document.getElementById('engine-select').value);
                const profileName = { car: 'car', bike: 'bicycle', foot: 'walking' }[profile];
                setStatus(`Calculating ${profileName} route through ${parsed.waypoints.length} stops…`);
                const rawPoints = await fetchRoute(parsed.waypoints, profile);

                const percent = parseInt(document.getElementById('simplify-slider').value, 10) || 1;
                setStatus(`Simplifying ${rawPoints.length.toLocaleString()} points at ${percent}%…`);
                await sleep(20);
                const simplified = simplifyTrack(rawPoints, percentToTolerance(percent));

                let warn = '';
                let eleSources = [];
                if (document.getElementById('elevation-check').checked) {
                    try {
                        const res = await fetchElevations(simplified, msg => setStatus(msg));
                        eleSources = res.sources;
                        if (res.note) warn = ' ' + res.note;
                        else if (res.filled > 0) warn = ` ${res.filled} point${res.filled > 1 ? 's' : ''} had no elevation and ${res.filled > 1 ? 'were' : 'was'} interpolated.`;
                    } catch (err) {
                        simplified.forEach(p => { p.ele = null; });
                        const msg = String(err.message || err).replace(/\.*$/, '') + '.';
                        warn = ` Elevation failed: ${msg} Saved track will have no elevation.`;
                    }
                }

                current = { points: simplified, waypoints: parsed.waypoints, name: buildRouteName(parsed.waypoints), eleSources: eleSources };
                drawRoute(simplified, parsed.waypoints);
                const summary = showResult(rawPoints.length);
                document.getElementById('save-btn').disabled = false;
                setStatus('Done · ' + summary + warn, warn ? '' : 'ok');
            } catch (err) {
                console.error(err);
                setStatus(err.message || String(err), 'error');
            } finally {
                busy = false;
                document.getElementById('convert-btn').disabled = false;
            }
        }

        // ===== INIT =====
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof L === 'undefined') {
                alert('Leaflet library failed to load.');
                return;
            }

            const copyrightText = document.getElementById('copyright-text');
            copyrightText.textContent = '© 2026 Tony Gozdz · RouteToGPX v' + APP_VERSION;

            initMap();
            map.on('mousemove', onMapPointer);
            map.on('click', onMapPointer);
            map.on('mouseout', hideProfileCursor);
            map.on('zoomend', rebuildTrackPx);
            locateOnOpen();

            const slider = document.getElementById('simplify-slider');
            const sliderValue = document.getElementById('simplify-value');
            slider.addEventListener('input', function() { sliderValue.textContent = this.value + '%'; });

            document.getElementById('convert-btn').addEventListener('click', convert);
            document.getElementById('save-btn').addEventListener('click', saveGPX);
            document.getElementById('url-input').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') { e.preventDefault(); convert(); }
            });

            const settingsBtn = document.getElementById('settings-btn');
            const settingsPanel = document.getElementById('settings-panel');
            settingsBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                const open = settingsPanel.classList.toggle('show');
                settingsBtn.classList.toggle('open', open);
            });
            settingsPanel.addEventListener('click', function(e) { e.stopPropagation(); });
            document.addEventListener('click', function() {
                settingsPanel.classList.remove('show');
                settingsBtn.classList.remove('open');
            });
        });
    </script>
</body>
</html>
